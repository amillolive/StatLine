[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "statline"
version = "4.0.0rc6"
description = "StatLine — weighted player scoring, efficiency modeling, CLI + adapter tooling"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "StatLine LLC" }]
keywords = [
  "statline",
  "pri",
  "adapters",
  "analytics",
  "esports",
  "basketball",
  "mvp",
  "efg",
  "cli",
  "slapi",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Environment :: Console",
]

# -------------------------------------------------------------------
# Base / Core
#
# pip install statline
#
# Core Python API + local scoring runtime.
# App and Gateway are optional sibling capability layers.
# -------------------------------------------------------------------

dependencies = [
  "pyyaml>=6.0,<7.0",
  "rich>=13.0,<15.0",
  'typing-extensions>=4.7; python_version<"3.15"',
]

[project.optional-dependencies]

# -------------------------------------------------------------------
# App
#
# pip install "statline[app]"
#
# Core + application/CLI/TUI dependencies.
# Does not require Gateway.
# -------------------------------------------------------------------

app = [
  "typer>=0.12,<1.0",
  "click>=8.1,<9.0",
  "httpx2>=2.0,<3.0",
  "textual>=8.0,<9.0",
]

# -------------------------------------------------------------------
# Gateway
#
# pip install "statline[gateway]"
#
# Core + HTTP/auth/service dependencies.
# Does not require App.
# -------------------------------------------------------------------

gateway = [
  "cryptography>=42.0,<47.0",
  "pydantic>=2.6,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

# -------------------------------------------------------------------
# All runtime capabilities
#
# pip install "statline[all]"
#
# Core + App + Gateway.
# -------------------------------------------------------------------

all = [
  "typer>=0.12,<1.0",
  "click>=8.1,<9.0",
  "httpx2>=2.0,<3.0",
  "textual>=8.0,<9.0",

  "cryptography>=42.0,<47.0",
  "pydantic>=2.6,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

# -------------------------------------------------------------------
# Development
#
# pip install -e ".[dev]"
#
# Core + App + Gateway + testing, typing, docs, packaging,
# security, and release tooling.
# -------------------------------------------------------------------

dev = [
  # App
  "typer>=0.12,<1.0",
  "click>=8.1,<9.0",
  "httpx2>=2.0,<3.0",
  "textual>=8.0,<9.0",

  # Gateway
  "cryptography>=42.0,<47.0",
  "pydantic>=2.6,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.30,<1.0",

  # Tests / coverage
  "pytest>=8.1",
  "pytest-cov>=4.1,<7.0",
  "coverage[toml]>=7.5,<8.0",
  "hypothesis>=6.100,<7.0",

  # Static analysis
  "ruff>=0.5,<1.0",
  "mypy>=1.11,<2.0",
  "pyright>=1.1.370,<2.0",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32",

  # Documentation
  "mkdocs-material>=9.5,<10.0",
  "mkdocstrings[python]>=0.25,<1.0",

  # Packaging / release
  "build>=1.2,<2.0",
  "twine>=7.0,<8.0",
  "pip-audit>=2.7,<3.0",
]

# -------------------------------------------------------------------
# StatLine component/release metadata
# -------------------------------------------------------------------

[tool.statline.release]
generation = 4
core = 1
app = 1
gateway = 1

# -------------------------------------------------------------------
# Console entry points
#
# IMPORTANT:
# These wrappers must not hard-fail merely because an optional extra
# is absent.
#
# `statline.cli:main` should lazy-import App and explain:
#   pip install "statline[app]"
#
# `statline.gateway...` / SLAPI launcher should similarly explain:
#   pip install "statline[gateway]"
#
# rc7 can move entry-point ownership into independently published
# component distributions.
# -------------------------------------------------------------------

[project.scripts]
statline = "statline.cli:main"
slapi = "statline.app.runner.main:main"

[project.urls]
Homepage = "https://statline.dev"
Repository = "https://github.com/amillolive/StatLine"
Issues = "https://github.com/amillolive/StatLine/issues"
Legal = "https://github.com/amillolive/StatLine/tree/main/legal"

# ===================================================================
# Tooling
# ===================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["statline", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Query",
  "typer.Argument",
  "typer.Option",
]

[tool.ruff.lint.per-file-ignores]
"statline/app/cli/main.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = ["typings"]

[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "uvicorn.*",
  "starlette.*",
]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
stubPath = "typings"
reportMissingTypeStubs = "none"

exclude = [
  ".venv",
  "**/__pycache__",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "typings/fastapi",
  "**/node_modules",
  "**/.*",
  "installer/payload/runtime/**",
  "webkit/node_modules/**",
  "webkit/.next/**",
  "webkit/dist/**",
  "webkit/build/**",
  "portal/node_modules/**",
  "portal/.next/**",
  "portal/dist/**",
  "portal/build/**",
  "integrations/**/node_modules/**",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["statline"]

omit = [
  "*/__pycache__/*",
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ===================================================================
# Hatch build configuration
# ===================================================================

[tool.hatch.build]

# Only the Python product lives under `statline/`.
#
# `webkit/` is intentionally outside the Python distribution.
include = [
  "statline/RELEASE",
  "statline/**/*.py",
  "statline/**/*.pyi",
  "statline/py.typed",
  "statline/**/*.yaml",
  "statline/**/*.yml",
  "statline/**/*.json",
  "statline/core/adapters/defs/*.yaml",
  "statline/core/datasets/**/*.csv",
]

exclude = [
  ".db/**",
  ".git/**",
  ".github/**",
  ".mypy_cache/**",
  ".pytest_cache/**",
  ".pytest-tmp/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
  "**/*.py[cod]",

  "statline/log/**",
  "statline/secrets/**",

  # Non-Python monorepo components
  "webkit/**",
  "portal/**",
  "integrations/**",
]

[tool.hatch.build.targets.wheel]
packages = ["statline"]

[tool.hatch.build.targets.wheel.force-include]
"statline/RELEASE" = "statline/RELEASE"
"assets/statpack-icon-main.png" = "statline/assets/statpack-icon-main.png"

[tool.hatch.build.targets.sdist]

include = [
  "statline/RELEASE",
  "statline/**/*.py",
  "statline/**/*.pyi",
  "statline/py.typed",
  "statline/**/*.yaml",
  "statline/**/*.yml",
  "statline/**/*.json",
  "statline/core/adapters/defs/*.yaml",
  "statline/core/datasets/**/*.csv",

  "tests/**/*.py",
  "scripts/**/*.py",
  "scripts/**/*.ps1",
  "scripts/**/*.sh",
  "typings/**/*.pyi",

  "assets/statpack-icon-main.png",

  "README.md",
  "HOWTO.md",
  "ARCHITECTURE.md",
  "LICENSE",
  "CLA.md",
  "TRADEMARK_POLICY.md",
  "legal/**/*.md",
  "mypy.ini",
  "pyproject.toml",
]

exclude = [
  ".db/**",
  ".git/**",
  ".github/**",
  ".mypy_cache/**",
  ".pytest_cache/**",
  ".pytest-tmp/**",
  ".ruff_cache/**",
  "**/__pycache__/**",
  "**/*.py[cod]",

  "statline/log/**",
  "statline/secrets/**",

  # Non-Python monorepo components have their own build/package lifecycle.
  "webkit/**",
  "portal/**",
  "integrations/**",
]