metrics:
- key: gp
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: GP
- key: real_gp
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    expr: gp
- key: real_gp1
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, real_gp)
- key: no_real
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: 1.0 - real_gp1
- key: rel_gp
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, real_gp / max(1.0, dataset_max("GP") * 0.65))
- key: ppg
  bucket: telem
  clamp:
  - 0.0
  - 32.0
  source:
    field: PPG
- key: rpg
  bucket: telem
  clamp:
  - 0.0
  - 14.0
  source:
    field: RPG
- key: apg
  bucket: telem
  clamp:
  - 0.0
  - 9.0
  source:
    field: APG
- key: spg
  bucket: telem
  clamp:
  - 0.0
  - 2.2
  source:
    field: SPG
- key: bpg
  bucket: telem
  clamp:
  - 0.0
  - 3.0
  source:
    field: BPG
- key: tov
  bucket: telem
  clamp:
  - 0.0
  - 3.5
  source:
    field: TPG
- key: fgm
  bucket: telem
  clamp:
  - 0.0
  - 15.0
  source:
    field: FGMPG
- key: fga
  bucket: telem
  clamp:
  - 0.0
  - 25.0
  source:
    field: FGAPG
- key: tpm
  bucket: telem
  clamp:
  - 0.0
  - 8.0
  source:
    field: 3PMPG
- key: tpa
  bucket: telem
  clamp:
  - 0.0
  - 14.0
  source:
    field: 3PAPG
- key: win
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: WIN
- key: loss
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: LOSS
- key: orpg
  bucket: telem
  clamp:
  - 0.0
  - 5.0
  source:
    expr: 0.35 * rpg
- key: drpg
  bucket: telem
  clamp:
  - 0.0
  - 10.0
  source:
    expr: 0.65 * rpg
- key: stat_total
  bucket: telem
  clamp:
  - 0.0
  - 999.0
  source:
    expr: ppg + rpg + apg + spg + bpg + tov + fgm + fga + tpm + tpa
- key: stat_active
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, stat_total)
- key: scoreable
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(real_gp1, stat_active)
- key: no_score
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: 1.0 - scoreable
