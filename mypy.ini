[mypy]
python_version = 3.14
strict = True
pretty = True
show_error_codes = True
warn_unused_configs = True
warn_unreachable = True
mypy_path = typings
plugins = pydantic.mypy

# Example and unpacked StatPack runners are independent scripts and may share
# the same module filename. Exclude only those directories from recursive mypy.
exclude = ^(?:\./)?(?:packs/|statline/public/statpacks/unpacked/)

[mypy-requests.*]
ignore_missing_imports = True

[mypy-httpx2.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True