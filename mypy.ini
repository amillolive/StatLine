[mypy]
python_version = 3.14
strict = True
pretty = True
show_error_codes = True
warn_unused_configs = True
warn_unreachable = True
mypy_path = typings
plugins = pydantic.mypy

[mypy-requests.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True