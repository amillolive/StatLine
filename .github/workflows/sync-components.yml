name: Sync component mirrors

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, next, dev]

permissions:
  contents: read

concurrency:
  group: component-sync-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync subtree mirrors
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require component sync credential
        env:
          SYNC_TOKEN: ${{ secrets.STATLINE_COMPONENT_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::STATLINE_COMPONENT_SYNC_TOKEN is not configured."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure component remotes
        env:
          SYNC_TOKEN: ${{ secrets.STATLINE_COMPONENT_SYNC_TOKEN }}
        run: |
          git remote add core "https://x-access-token:${SYNC_TOKEN}@github.com/amillolive/StatLine-core.git"
          git remote add app "https://x-access-token:${SYNC_TOKEN}@github.com/amillolive/StatLine-app.git"
          git remote add gateway "https://x-access-token:${SYNC_TOKEN}@github.com/amillolive/StatLine-gateway.git"

      - name: Sync changed component histories
        env:
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git checkout -B "$TARGET_BRANCH" "${{ github.event.workflow_run.head_sha }}"
          bash scripts/sync-components.sh
