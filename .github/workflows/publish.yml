name: Publish (PyPI)

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"
  TZ: "UTC"

jobs:
  publish-pypi:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi

    steps:
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Show distribution
        run: |
          echo "Publishing the following tested artifacts:"
          find dist -maxdepth 1 -type f -print

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true