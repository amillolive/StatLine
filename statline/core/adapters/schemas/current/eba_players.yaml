# ─────────────────────────────────────────────────────────────────────────────
# Buckets
# ─────────────────────────────────────────────────────────────────────────────

buckets:
  scoring_gravity:
    title: Scoring Gravity
    description: High-volume efficient scoring with turnover control.
  aefg:
    title: Shooting Efficiency
    description: efg/pps-style efficiency signals and usage efficiency.
  effloor:
    title: Efficiency Floor
    description: Penalties for below-floor efficiency and low volume.
  tov_eff:
    title: Turnovers
    description: Ball security and playmaking-to-turnover signals.
  stocks:
    title: Stocks
    description: Defensive event “stocks” (steals + blocks composite).
  vers:
    title: Versatility
    description: Multi-skill blend across scoring, rebounding, and playmaking.
  helios:
    title: Helios
    description: Star load / primary-creator composite.
  two_way:
    title: Two-Way
    description: Balance of offense and defense signals.
  offball:
    title: Off-Ball Impact
    description: Non-scoring impact via passing + rebound activity.
  wl:
    title: Win-Loss
    description: Win share proxy from team record.
  spg_sig:
    title: Steal Signature
    description: Steal signal shaping channel.
  bpg_sig:
    title: Block Signature
    description: Block signal shaping channel.
  handle:
    title: Handle
    description: Ball-handling / creation load proxy.
  telem:
    title: Telemetry
    description: Catch-all routing bucket for tracked/reused metrics (weight must be 0).

# ─────────────────────────────────────────────────────────────────────────────
# Metrics
# ─────────────────────────────────────────────────────────────────────────────

metrics:
- key: gp
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: GP
- key: real_gp
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    expr: gp
- key: real_gp1
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, real_gp)
- key: no_real
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: 1.0 - real_gp1
- key: rel4
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, real_gp / 4.0)
- key: ppg
  bucket: telem
  clamp:
  - 0.0
  - 32.0
  source:
    field: PPG
- key: rpg
  bucket: telem
  clamp:
  - 0.0
  - 14.0
  source:
    field: RPG
- key: apg
  bucket: telem
  clamp:
  - 0.0
  - 9.0
  source:
    field: APG
- key: spg
  bucket: telem
  clamp:
  - 0.0
  - 2.2
  source:
    field: SPG
- key: bpg
  bucket: telem
  clamp:
  - 0.0
  - 3.0
  source:
    field: BPG
- key: tov
  bucket: telem
  clamp:
  - 0.0
  - 3.5
  source:
    field: TPG
- key: fgm
  bucket: telem
  clamp:
  - 0.0
  - 15.0
  source:
    field: FGMPG
- key: fga
  bucket: telem
  clamp:
  - 0.0
  - 25.0
  source:
    field: FGAPG
- key: tpm
  bucket: telem
  clamp:
  - 0.0
  - 8.0
  source:
    field: 3PMPG
- key: tpa
  bucket: telem
  clamp:
  - 0.0
  - 14.0
  source:
    field: 3PAPG
- key: win
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: WIN
- key: loss
  bucket: telem
  clamp:
  - 0.0
  - 16.0
  source:
    field: LOSS
- key: orpg
  bucket: telem
  clamp:
  - 0.0
  - 5.0
  source:
    expr: 0.35 * rpg
- key: drpg
  bucket: telem
  clamp:
  - 0.0
  - 10.0
  source:
    expr: 0.65 * rpg
- key: stat_total
  bucket: telem
  clamp:
  - 0.0
  - 999.0
  source:
    expr: ppg + rpg + apg + spg + bpg + tov + fgm + fga + tpm + tpa
- key: stat_active
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: min(1.0, stat_total)
- key: scoreable
