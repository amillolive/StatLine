  source:
    expr: min(real_gp1, stat_active)
- key: no_score
  bucket: telem
  clamp:
  - 0.0
  - 1.0
  source:
    expr: 1.0 - scoreable

# ─────────────────────────────────────────────────────────────────────────────
# Efficiency
# ─────────────────────────────────────────────────────────────────────────────

efficiency:
- key: scoring_gravity
  bucket: scoring_gravity
  clamp:
  - 0.0
  - 1.25
  min_den: 1
  make: 'scoreable * min(1.20, ppg / 36.0) * min(1.15, pps_fg / 1.35) * min(1.10, fga / 22.0) * (1 - 0.12 * min(1, tov / 3.5))

    '
  attempt: '1'
- key: spg_sig
  bucket: spg_sig
  clamp:
  - 0.0
  - 1.8
  min_den: 1
  make: scoreable * spg
  attempt: '1.2'
- key: bpg_sig
  bucket: bpg_sig
  clamp:
  - 0.0
  - 1.1
  min_den: 1
  make: scoreable * ((min(bpg, 2.0) + 0.25*max(0, bpg-2.0)) / max(0.85, 1.0 + 0.06*drpg))
  attempt: '2.2'
- key: pps_fg
  bucket: aefg
  clamp:
  - 0.0
  - 1.45
  min_den: 1
  make: scoreable * (2.0 * (fgm + 0.5*tpm))
  attempt: max(1.0, fga)
- key: eff_usage
  bucket: aefg
  clamp:
  - 0.0
  - 1.55
  min_den: 1
  make: scoreable * pps_fg * fga
  attempt: '22'
- key: net_pos_ppp
  bucket: aefg
  clamp:
  - 0.0
  - 1.25
  min_den: 1
  make: scoreable * (ppg - 1.1*tov)
  attempt: max(1.0, fga + 0.5*apg)
- key: pps_gap
  bucket: effloor
  invert: true
  clamp:
  - 0.0
  - 0.6
  min_den: 1
  make: "no_score * 0.60 + scoreable * (\n  max(0, 1.08 - pps_fg)\n  + 0.50*max(0, pps_fg - 1.35)\n)\n"
  attempt: '1'
- key: vol_gap
  bucket: effloor
  invert: true
  clamp:
  - 0.0
  - 2.0
  min_den: 1
  make: no_score * 2.0 + scoreable * max(0, 14 - ppg)
  attempt: '1'
- key: shot_diet_gap
  bucket: effloor
  invert: true
  clamp:
  - 0.0
  - 0.6
  min_den: 1
  make: "no_score * 0.60 + scoreable\n  * max(0, (tpa/max(1e-6,fga)) - 0.70)\n  * max(0, 1.28 - ((fga - tpa))) / 1.28\n  * max(0, pps_fg - 1.22)\n  * min(1, 10/max(1e-6,fga))\n"
  attempt: '1'
- key: stocks_boost
  bucket: stocks
  clamp:
  - 0.0
  - 1.5
  min_den: 1
  make: scoreable * (spg + 1.05*min(bpg, 2.0) + 0.35*max(0, bpg - 2.0))
  attempt: '3.2'
- key: scoreless_impact
  bucket: offball
  clamp:
  - 0.0
  - 1.0
  min_den: 1
  make: scoreable * (0.55*min(1, apg/10) + 0.45*min(1, (1.3*orpg+0.7*drpg)/10))
  attempt: '1.0'
- key: vers_score
  bucket: vers
  clamp:
  - 0.0
  - 1.0
  min_den: 1
  make: scoreable * ((0.65*((min(1, ppg/24) + min(1, (1.6*orpg+drpg)/10) + min(1, apg/10))/3)) + (0.45*((min(1, ppg/24)*min(1, (1.6*orpg+drpg)/10) + min(1, ppg/24)*min(1, apg/10) + min(1, (1.6*orpg+drpg)/10)*min(1, apg/10))/3)))
  attempt: '1.18'
- key: handle_load
  bucket: handle
  clamp:
  - 0.0
  - 1.1
  min_den: 1
  make: scoreable * (apg / max(1.0, 0.6*fga + tov))
  attempt: '1'
- key: helios_score
  bucket: helios
  clamp:
  - 0.0
  - 0.9
  min_den: 1
  make: scoreable * (ppg + 0.9*apg - 0.4*tov)
  attempt: '38'
- key: tov_scaled
  bucket: tov_eff
  clamp:
  - 0.0
  - 0.95
  min_den: 1
  make: scoreable * (1 - (tov / max(3, 0.80*(fga + 0.7*apg))))
  attempt: '1'
- key: ast_to_credit
  bucket: tov_eff
  clamp:
  - 0.0
  - 2.5
  min_den: 1
  make: scoreable * apg
  attempt: max(1.0, tov)
- key: ast_to_bonus
  bucket: tov_eff
  clamp:
  - 0.0
  - 0.08
  min_den: 1
  make: scoreable * max(0, (apg / max(1.0, tov)) - 2.0)
  attempt: '6.0'
- key: two_way_score
  bucket: two_way
  clamp:
  - 0.0
  - 0.8
  min_den: 1
  make: scoreable * min(2, (2 * ((ppg+0.9*apg)/42) * ((0.7*spg+0.4*bpg)/2.5)) / max(0.0001, ((ppg+0.9*apg)/42) + ((0.7*spg+0.4*bpg)/2.5))))
  attempt: '1'
- key: wl_share
  bucket: wl
  clamp:
  - 0.0
  - 1.0
  min_den: 0.5
  make: scoreable * win
  attempt: max(1.0, win + loss)

